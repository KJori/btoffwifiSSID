name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish a release from main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: rtest/pom.xml

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_B64" | base64 -d > signing/release.jks
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning title=Not release-signed::No KEYSTORE_B64 secret, so the APK is signed with a throwaway key and will not install over the existing app."
            echo "SIGNED=throwaway" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" ./build.sh

      - name: Run tests
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" rtest/ci.sh

      - name: Publish screenshots (screenshots branch)
        if: always() && hashFiles('rtest/screenshots/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd rtest/screenshots
          git init -q -b screenshots
          git add *.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

      - name: Upload APK and test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BtOffOnWifi-${{ env.SIGNED }}-${{ github.sha }}
          path: |
            BtOffOnWifi.apk
            rtest/test_out.txt
          if-no-files-found: ignore

      - name: Publish release (main, release-signed, new version only)
        if: github.ref == 'refs/heads/main' && env.SIGNED == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -o 'android:versionName="[^"]*"' app/AndroidManifest.xml | cut -d'"' -f2)
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "Release v$v already exists"
          else
            gh release create "v$v" BtOffOnWifi.apk --target "$GITHUB_SHA" \
              --title "BT Off on Wi-Fi $v" \
              --notes "Download BtOffOnWifi.apk on the phone and open it to install or update. See the README for setup."
          fi

      - name: Install fdroidserver
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install --quiet fdroidserver
          echo "$RUNNER_TEMP/fdroid-venv/bin" >> "$GITHUB_PATH"

      - name: F-Droid repo (publishes on main with the release key, dry run elsewhere)
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && env.SIGNED == 'release' && 'yes' || 'no' }}
        run: fdroid/publish.sh
